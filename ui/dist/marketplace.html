  <body>
    <div id="app" class="mp-shell">
      <!-- Top Alerts -->
      <div id="alerts" class="mp-alerts" aria-live="polite"></div>

      <!-- Sticky Header -->
      <header class="mp-header">
        <div class="mp-header-top">
          <div class="mp-title-group">
            <img class="mp-brand-icon" src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%20width='32'%20height='32'%20fill='none'%3e%3cdefs%3e%3clinearGradient%20id='mp-logo-grad'%20x1='2'%20y1='2'%20x2='30'%20y2='30'%20gradientUnits='userSpaceOnUse'%3e%3cstop%20offset='0%25'%20stop-color='%233b82f6'%20/%3e%3cstop%20offset='55%25'%20stop-color='%236366f1'%20/%3e%3cstop%20offset='100%25'%20stop-color='%238b5cf6'%20/%3e%3c/linearGradient%3e%3c/defs%3e%3crect%20x='2'%20y='2'%20width='28'%20height='28'%20rx='7.5'%20fill='url(%23mp-logo-grad)'%20/%3e%3crect%20x='7'%20y='7.5'%20width='7.5'%20height='7.5'%20rx='2'%20fill='%23ffffff'%20/%3e%3crect%20x='7'%20y='17.5'%20width='7.5'%20height='7.5'%20rx='2'%20fill='%23ffffff'%20fill-opacity='0.88'%20/%3e%3crect%20x='17'%20y='17.5'%20width='7.5'%20height='7.5'%20rx='2'%20fill='%23ffffff'%20fill-opacity='0.88'%20/%3e%3cpath%20d='M21%206.2L22.35%209.15L25.3%2010.5L22.35%2011.85L21%2014.8L19.65%2011.85L16.7%2010.5L19.65%209.15L21%206.2Z'%20fill='%23fde68a'%20/%3e%3c/svg%3e" alt="" width="28" height="28" />
            <div class="mp-title-text">
              <h1 class="mp-brand-title">Community Plugins</h1>
              <span id="catalog-meta" class="mp-muted mp-meta">Loading catalog...</span>
            </div>
          </div>
          <div class="mp-header-actions">
            <label id="project-pill" class="mp-project-pill" hidden title="Target folder for Project installs (.agents/plugins)">
              <span class="mp-pill-label">Project:</span>
              <select id="project-select" aria-label="Active project root" title="Active workspace folder used for Project-scoped plugin installs"></select>
              <button id="btn-custom-project" type="button" class="mp-icon-btn" title="Set a custom project workspace folder path">
                Edit
              </button>
            </label>
            <div id="custom-project-editor" class="mp-project-editor" hidden>
              <input
                id="custom-project-input"
                class="mp-input mp-project-input"
                type="text"
                placeholder="Absolute path to project..."
                aria-label="Custom project workspace path"
                title="Enter the absolute path to your project root"
              />
              <button id="btn-save-project" type="button" class="mp-btn mp-btn-primary" title="Apply custom project workspace path">Apply</button>
              <button id="btn-cancel-project" type="button" class="mp-btn" title="Cancel editing project path">Cancel</button>
            </div>
            <button id="btn-refresh" type="button" class="mp-btn mp-btn-secondary" title="Sync the signed catalog and check installed plugins for updates">
              Check Updates
            </button>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="mp-tabs" role="tablist" aria-label="Marketplace views">
          <button class="mp-tab is-active" data-tab="browse" role="tab" aria-selected="true" title="Browse all verified plugins in the community catalog">
            Browse <span class="mp-count" id="count-browse">0</span>
          </button>
          <button class="mp-tab" data-tab="installed" role="tab" aria-selected="false" title="View plugins installed globally or in the active project">
            Installed <span class="mp-count" id="count-installed">0</span>
          </button>
          <button class="mp-tab" data-tab="updates" role="tab" aria-selected="false" title="View installed plugins with verified updates available">
            Updates <span class="mp-count mp-count-accent" id="count-updates">0</span>
          </button>
          <button class="mp-tab" data-tab="favorites" role="tab" aria-selected="false" title="View plugins you starred as favorites">
            Favorites <span class="mp-count" id="count-favorites">0</span>
          </button>
          <label class="mp-toggle-hidden" title="Include plugins you previously hid from the list">
            <input type="checkbox" id="chk-show-hidden" />
            <span>Show Hidden</span>
          </label>
        </nav>

        <!-- Search & Collapsible Filter Bar -->
        <div class="mp-controls">
          <div class="mp-controls-row">
            <input
              id="search-input"
              class="mp-input mp-search"
              type="search"
              placeholder="Search plugins, authors, tags..."
              autocomplete="off"
              title="Search plugins by name, author, description, category, or tag"
            />
            <button
              id="btn-toggle-filters"
              type="button"
              class="mp-btn mp-filter-toggle"
              aria-expanded="false"
              aria-controls="filter-drawer"
              title="Show or hide category, surface, risk, and sort filters"
            >
              Filters
            </button>
            <button
              id="btn-clear-filters"
              type="button"
              class="mp-icon-btn mp-filter-clear"
              title="Reset all active filters and sorting"
              hidden
            >
              Clear
            </button>
          </div>

          <div id="filter-drawer" class="mp-filter-drawer" hidden>
            <select id="filter-category" class="mp-select" aria-label="Filter by category" title="Filter plugins by registry category">
              <option value="all">All Categories</option>
            </select>
            <select id="filter-surface" class="mp-select" aria-label="Filter by surface" title="Filter plugins by integration surface (UI, rules, MCP server, or hooks)">
              <option value="all">All Surfaces</option>
              <option value="sidebar_ui">Has Sidebar UI</option>
              <option value="prompt_only">Prompt / Rules Only</option>
              <option value="mcp_stdio">Local MCP Server</option>
              <option value="hooks">Shell Lifecycle Hooks</option>
            </select>
            <select id="filter-risk" class="mp-select" aria-label="Maximum risk tier" title="Filter plugins by maximum automated security risk tier">
              <option value="all">Any Risk Tier</option>
              <option value="low">Low Risk Only</option>
              <option value="elevated">Low + Elevated</option>
            </select>
            <select id="sort-select" class="mp-select" aria-label="Sort plugins" title="Choose how plugin results are ordered">
              <option value="stars">Sort: Stars</option>
              <option value="updated">Sort: Recently Updated</option>
              <option value="risk">Sort: Lowest Risk</option>
              <option value="name">Sort: Name (A-Z)</option>
            </select>
            <label class="mp-chip-check" title="Hide plugins that require external API keys or OAuth login">
              <input type="checkbox" id="chk-no-creds" />
              <span>No API Keys</span>
            </label>
          </div>
        </div>
      </header>

      <!-- Responsive Plugin Card Grid -->
      <main id="plugin-grid" class="mp-grid" aria-live="polite"></main>
    </div>

    <!-- Slide-Over Audit & Permission-Diff Drawer -->
    <div id="drawer-backdrop" class="mp-backdrop" hidden></div>
    <aside id="audit-drawer" class="mp-drawer" aria-hidden="true" role="dialog" aria-modal="true">
      <div id="drawer-content" class="mp-drawer-inner"></div>
    </aside>

  </body>
</html>
